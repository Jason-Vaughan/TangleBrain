version: 2

updates:
  # One grouped PR keeps the whole Python dependency surface visible without
  # turning a weekly check into a queue of individual reviewer interruptions.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  # Workflow actions include the trusted-publishing path, so they need the same
  # deliberate upgrade signal as Python packages.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      workflow-actions:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
