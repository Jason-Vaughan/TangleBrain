name: Publish to PyPI

# Publishes to PyPI via OIDC trusted publishing whenever a GitHub release is
# published — no API token is stored anywhere. PyPI-side prerequisite: the
# project's Publishing settings must list this repo + workflow (publish.yml)
# + environment (pypi) as a trusted publisher.
on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The release tag (vX.Y.Z) and pyproject.toml must agree, otherwise the
      # upload would publish a version that doesn't match the tagged source.
      - name: Check tag matches pyproject version
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      # Upload and download must move as a pair. From upload v7 / download v8 the two
      # share a direct-upload contract: upload can skip zipping (`archive: false`) and
      # download decides whether to decompress by sniffing Content-Type. Neither option
      # is used here — this is a directory, so it zips, and the round trip is by name —
      # but bumping one side alone puts a producer and a consumer of that contract on
      # either side of it. Bump both, or neither.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tanglebrain/
    permissions:
      id-token: write
    steps:
      # download v8 defaults `digest-mismatch` to `error`: a download whose hash does not
      # match the server's now fails the job instead of logging a warning. That is the
      # behaviour we want on the one path that uploads to PyPI — a corrupted dist should
      # never reach the publish step — so the default is taken deliberately, not by omission.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      # DELIBERATELY NOT SHA-PINNED, unlike every action above. `release/v1` is a *branch*,
      # not a tag, so there is no version to pin to — upstream moves it, and pinning a commit
      # from it would freeze this at a point nobody chose and silently stop receiving the
      # security fixes a publishing action most needs. Whether to track a branch here at all is
      # its own decision, larger than the pinning pass that pinned the rest, and it is the one
      # action that actually uploads to PyPI — so it was left alone rather than changed under a
      # release. The decision is tracked at
      # https://github.com/Jason-Vaughan/TangleBrain/issues/232 — do not "finish the job" by
      # pinning this line without making it there first.
      - uses: pypa/gh-action-pypi-publish@release/v1
