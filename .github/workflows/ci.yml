name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A dependency can break the build with no commit to blame, and a push-only CI never notices:
  # after the mcp 2.0.0 release, `main` read green for days because its last run predated the
  # release, and the failure first surfaced on an unrelated markdown-only PR. This run resolves
  # dependencies fresh (`pip install -e ".[delegate,dev]"`, no lockfile, no cache), so it sees what
  # a user's install would resolve to today rather than what it resolved to at the last push. The
  # `dev` extra is in that resolve because the job runs `make test`, which builds the venv — so a
  # ruff or mypy release that breaks us is caught here too, and needs no watch of its own.
  #
  # Off the hour deliberately — GitHub queues scheduled jobs globally and runs clustered at :00
  # are the most delayed. Note GitHub disables a repo's scheduled workflows after 60 days with no
  # activity; this one is a canary, so a silently disabled schedule is worth noticing.
  schedule:
    - cron: "17 6 * * 1"
  # Lets the canary be exercised on demand rather than only by waiting a week for it.
  workflow_dispatch:

jobs:
  test:
    name: make test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Runs the hermetic suite exactly as a contributor does (lint + venv + unittest).
      # The TANGLEBRAIN_LIVE-gated tests are skipped: CI has no backend, and the env var
      # is deliberately left unset.
      - name: Run the test suite
        run: make test
