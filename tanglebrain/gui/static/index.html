<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TangleBrain — knob panel</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
  :root {
    --primary: #8BC34A; --primary-bright: #9CCC65; --primary-dark: #558B2F;
    --bg: #000; --card-bg: #0D0D0D; --elevated-bg: #1A1A1A;
    --text: #E8E8E8; --text-muted: #888; --danger: #EF5350; --amber: #FFA726;
    /* --border is decorative only (cards, table rules, pills, the sidebar's edge): WCAG 1.4.11
       governs what is needed to *identify a component*, and none of those are. The outlines that
       DO identify a control carry the 3:1 the SC requires: --field-border on text inputs,
       --primary-dark on buttons, --primary-bright on focus. Ratios are asserted in
       tests/test_gui_contrast.py — change a value here and it will tell you what it broke. */
    --border: #222; --field-border: #666;
    /* The centre column's geometry. Two elements share it — the content and the status bar's
       inner column — and they must agree or the bar's text drifts away from the cards it
       qualifies. Declared once so they cannot disagree. Not colours: `load_palette` skips any
       token that is not a colour literal, so the contrast guards do not see these. */
    --content-max: 960px; --content-inset: 20px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif;
    line-height: 1.5;
  }

  /* ---- shell ---------------------------------------------------------------------------- */
  /* Two panes: a persistent nav and one visible view. The views are siblings rather than
     separate pages so the panel stays a single packaged file served by a stdlib handler — the
     offline guarantee (a default install reaches nothing off-machine) rules out a build step or
     a client router, and there is no server route to add. */
  .app { display: flex; align-items: flex-start; min-height: 100vh; }

  .skip {
    position: absolute; left: -9999px; top: 8px;
    background: var(--elevated-bg); color: var(--primary); border: 1px solid var(--primary-dark);
    border-radius: 8px; padding: 8px 14px; text-decoration: none; z-index: 10;
  }
  /* Visible only while focused — a keyboard user's first stop, invisible to everyone else. */
  .skip:focus { left: 16px; }

  /* `height: 100vh` rather than a stretched flex item: an item that fills its container cannot
     stick, so `align-self: stretch` here would leave the nav scrolling away up the Settings
     view — which is the long one, and the one you most want the nav from. */
  .sidebar {
    flex: 0 0 200px; height: 100vh; background: var(--card-bg);
    border-right: 1px solid var(--border); padding: 20px 12px; position: sticky; top: 0;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
  .brand .logo { width: 32px; height: 32px; display: block; }
  .brand .name { font-size: 1.05rem; letter-spacing: .3px; }
  .brand .accent { color: var(--primary); }
  .nav { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .navlink {
    display: block; padding: 9px 12px; border-radius: 8px; text-decoration: none;
    color: var(--text-muted); font-size: .9rem;
  }
  .navlink:hover { background: var(--elevated-bg); color: var(--text); }
  .navlink.active { background: var(--elevated-bg); color: var(--primary); }
  .navlink:focus-visible { outline: 2px solid var(--primary-bright); outline-offset: 1px; }

  /* A column so the status footer can be pushed to the bottom of a short view by `margin-top:
     auto` and pinned to the viewport by `position: sticky` on a long one. `min-height: 100vh`
     is what gives the short case a bottom to be pushed to. The page padding belongs to `.wrap`
     and not here: on `.main` it would sit *below* the sticky bar. */
  .main {
    flex: 1 1 auto; min-width: 0; min-height: 100vh;
    display: flex; flex-direction: column; padding: 0;
  }
  /* The skip target is only focusable to receive that focus; it is not an interactive control,
     so a focus ring on it would say otherwise. Focus remains visible on every real control. */
  .main:focus { outline: none; }
  /* `flex: 1 0 auto` rather than a plain `flex: 1`: the content sets its own height and grows
     the pane, it is never compressed to fit one. */
  /* `box-sizing: border-box` is global, so the side inset comes OUT of max-width rather than
     adding to it: 960 - 2x20 is a 920px content column. */
  .wrap {
    max-width: var(--content-max); width: 100%; margin: 0 auto; flex: 1 0 auto;
    padding: 24px var(--content-inset) 64px;
  }
  /* `[hidden]` is a UA rule, so any author `display` on a view or its container would beat it and
     leave a hidden view showing. `.wrap` carries none, which is what makes this belt-and-braces
     rather than load-bearing — and what makes adding one safe. */
  .view[hidden] { display: none; }

  /* ---- status footer ---------------------------------------------------------------------- */
  /* Chrome, not content. The placeholder-pricing caveat and the measurement-health findings
     qualify every figure the panel shows, and both rendered only inside the Settings stats card
     — one navigation click from the view you land on. Sticky rather than fixed: fixed would
     cover the sidebar and need the body reserving space for a bar that is usually absent.
     Inside `.main`, so it spans exactly the pane whose figures it qualifies. */
  .statusbar {
    position: sticky; bottom: 0; margin-top: auto;
    background: var(--card-bg); border-top: 1px solid var(--border);
    font-size: .78rem;
  }
  /* `[hidden]` is a UA rule, and any author `display` on this element would outrank it and leave
     the bar permanently visible and — in the common case — permanently empty. That is the trap
     the `.view[hidden]` note above describes; nothing declares one here today, and this is what
     keeps that safe to stop checking. */
  .statusbar[hidden] { display: none; }
  /* The bar's background and rule span the whole pane; its text lines up with the column it
     qualifies. Same box as `.wrap`, or on a wide window the items start at the pane's edge while
     the cards they annotate sit hundreds of pixels to the right. */
  .statusbar-inner {
    max-width: var(--content-max); margin: 0 auto; padding: 8px var(--content-inset);
    display: flex; flex-wrap: wrap; gap: 2px 18px;
  }
  .statusbar .item { color: var(--amber); }
  /* Muted, not amber: "we could not ask" is a different claim from "we asked and it is bad". */
  .statusbar .item.unknown { color: var(--text-muted); }
  .view-title { font-size: 1.3rem; margin: 0 0 4px; letter-spacing: .3px; }
  .view-sub { color: var(--text-muted); font-size: .8rem; margin-bottom: 20px; }

  /* Narrow viewports: the nav becomes a row above the content rather than a squeezed column. */
  @media (max-width: 720px) {
    .app { flex-direction: column; }
    .sidebar {
      flex: none; width: 100%; height: auto; position: static; padding: 14px 12px;
      border-right: none; border-bottom: 1px solid var(--border); overflow-y: visible;
    }
    .brand { padding-bottom: 12px; }
    .nav { flex-direction: row; }
    .navlink { padding: 8px 14px; }
    /* The sidebar is stacked above the pane here, so a pane that still demanded a full viewport
       would guarantee a scrollbar on every page. Short views end with the bar directly under the
       content instead of at the foot of the screen; long ones still pin it. */
    .main { width: 100%; min-height: 0; }
    /* One override, and both columns follow it. */
    :root { --content-inset: 16px; }
    .wrap { padding: 20px var(--content-inset) 48px; }
  }

  /* ---- content -------------------------------------------------------------------------- */
  h2 { font-size: .95rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin: 28px 0 10px; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: .68rem; letter-spacing: .5px; }
  td.mono, .mono { font-family: 'SF Mono', Menlo, monospace; font-size: .8rem; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .7rem; border: 1px solid var(--border); margin: 1px 3px 1px 0; }
  .pill.local { color: var(--primary); border-color: var(--primary-dark); }
  .pill.sub { color: var(--primary-bright); }
  .pill.api { color: var(--amber); }
  .pill.orch { color: var(--primary); border-color: var(--primary-dark); }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat { background: var(--elevated-bg); border-radius: 8px; padding: 12px 14px; }
  .stat .label { color: var(--text-muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; }
  .stat .value { font-size: 1.3rem; margin-top: 4px; }
  .stat .value.big { color: var(--primary); }
  .caveat { color: var(--amber); font-size: .78rem; margin-top: 10px; }
  .sub-head { font-size: .85rem; margin: 1.1rem 0 .4rem; }

  /* ---- the two spend breakdowns ------------------------------------------------------------
     Both are hand-built. The panel is one packaged file that must render with the machine
     offline, so a charting library is not available to it: a CDN script would reach off-machine,
     and a vendored minified copy cannot be reviewed in a diff. What that costs is zoom and
     tooltips; what it buys is a chart that works on an air-gapped laptop.

     The per-model split is a TABLE rather than a chart on purpose — a handful of categorical rows
     where the exact dollars are the point, and a table is natively readable by a screen reader.
     The bars beside the numbers are decoration on a value the row already states. */
  .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .win { display: flex; gap: 6px; }
  /* Rest state is muted, selected is the accent — the same language the sidebar's nav uses, and
     chosen over accent-vs-brighter-accent because those two greens differ by too little to read as
     a state at this size. aria-pressed is what actually announces it; this paints what that says. */
  .win button { padding: 4px 10px; font-size: .75rem; color: var(--text-muted); border-color: var(--border); }
  .win button[aria-pressed="true"] { color: var(--primary); border-color: var(--primary-dark); background: var(--elevated-bg); }
  /* `preserveAspectRatio: none` stretches the plot to the card's width — far more horizontally
     than vertically — so anything sized in user units comes out distorted. `vector-effect` exempts
     the STROKE from that transform, which is why both marks here are strokes: the line keeps its
     2px, and the newest day is a zero-length round-capped line, which renders as a true circle
     where a `<circle>` would render as a sliver. `overflow: visible` lets that cap sit on the edge
     of the plot instead of being sheared in half by it. */
  .spark { display: block; width: 100%; height: 72px; margin: 10px 0 4px; overflow: visible; }
  .spark polyline, .spark line { vector-effect: non-scaling-stroke; }
  .spark polyline { fill: none; stroke: var(--primary); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .spark line { stroke: var(--primary-bright); stroke-width: 6; stroke-linecap: round; }
  .chart-caption { color: var(--text-muted); font-size: .75rem; }
  /* The chart's table twin. A shape is not a value: every figure the sparkline draws is also
     readable as text here, which is what makes the chart's absence of tooltips survivable. */
  .twin { margin-top: 10px; }
  .twin summary { color: var(--text-muted); font-size: .75rem; cursor: pointer; }
  .twin table { margin-top: 6px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .barcell { width: 32%; }
  .bar { display: block; height: 8px; border-radius: 4px; background: var(--primary-dark); min-width: 2px; }
  textarea, input[type=text] {
    width: 100%; background: var(--elevated-bg); border: 1px solid var(--field-border); color: var(--text);
    border-radius: 8px; padding: 10px; font-family: inherit; font-size: .9rem; resize: vertical;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--primary-bright); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  label.chk { color: var(--text-muted); font-size: .82rem; display: flex; align-items: center; gap: 6px; }
  button {
    background: var(--card-bg); color: var(--primary); border: 1px solid var(--primary-dark);
    border-radius: 8px; padding: 9px 18px; font-size: .9rem; cursor: pointer; font-family: inherit;
  }
  button:hover { background: var(--elevated-bg); }
  button:disabled { color: var(--text-muted); border-color: var(--border); cursor: default; }
  pre.out { background: var(--elevated-bg); border: 1px solid var(--border); border-radius: 8px;
            padding: 12px; white-space: pre-wrap; word-break: break-word; margin-top: 12px; font-size: .85rem; }
  .served { color: var(--text-muted); font-size: .78rem; margin-top: 8px; }
  .served b { color: var(--primary); }
  .err { color: var(--danger); }
  .muted { color: var(--text-muted); }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="app">
  <nav class="sidebar" aria-label="Primary">
    <div class="brand">
      <!-- Decorative: the wordmark beside it carries the name, so alt="" keeps a screen reader
           from announcing it twice. -->
      <img class="logo" src="/logo.png" alt="">
      <span class="name">Tangle<span class="accent">Brain</span></span>
    </div>
    <ul class="nav">
      <li><a class="navlink" id="nav-chat" href="#/chat">Chat</a></li>
      <li><a class="navlink" id="nav-settings" href="#/settings">Settings</a></li>
    </ul>
  </nav>

  <!-- tabindex="-1" so the skip link moves focus rather than only scrolling: without it Safari
       scrolls and leaves focus on the link, so the next Tab resumes from the top of the page. -->
  <main class="main" id="main" tabindex="-1">
   <div class="wrap">
    <section class="view" id="view-chat" aria-labelledby="chat-title">
      <h1 class="view-title" id="chat-title">Chat playground</h1>
      <div class="view-sub">run a prompt through the router and see which tier served it</div>

      <div class="card">
        <textarea id="prompt" rows="3" placeholder="Ask the router something…"></textarea>
        <div class="row">
          <input type="text" id="task" placeholder="task hint (optional: code, reasoning, long-context)" style="flex:1; min-width:220px;">
          <label class="chk"><input type="checkbox" id="local"> force local ($0)</label>
          <button id="run">Run</button>
        </div>
        <div id="runResult"></div>
      </div>
    </section>

    <section class="view" id="view-settings" aria-labelledby="settings-title" hidden>
      <h1 class="view-title" id="settings-title">Settings</h1>
      <div class="view-sub">roster &amp; pricing config · local spend-avoided rollup</div>

      <h2>Spend avoided <span class="muted">(local rollup, lifetime)</span></h2>
      <div class="card" id="statsCard"><span class="muted">loading…</span></div>

      <h2>Roster</h2>
      <div class="card" id="rosterCard"><span class="muted">loading…</span></div>

      <h2>Pricing reference</h2>
      <div class="card" id="pricingCard"><span class="muted">loading…</span></div>
    </section>
   </div>

   <!-- `role="status"` is a polite live region: a finding that appears after a run is announced
        without interrupting what the reader is doing. Empty and hidden until `/api/stats`
        answers — an empty bar would read as "checked, all clear", which is the one thing the
        no-answer case must not look like. -->
   <footer class="statusbar" id="statusbar" role="status" aria-label="Panel status" hidden>
     <div class="statusbar-inner" id="statusbarItems"></div>
   </footer>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
// Full 5-char HTML escape — values are inserted into both text nodes AND attribute contexts
// (e.g. the editable pricing inputs' value="..."), so quotes MUST be escaped too.
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- view routing ---------------------------------------------------------------------------
// Hash routing rather than JS-only show/hide: the fragment never reaches the server, so
// `dispatch()` needs no new route and the panel stays one packaged file, while the browser's
// back/forward and a bookmarked view both work.
//
// The router owns the `#/` prefix and nothing else. A page has exactly one fragment, and plain
// in-page anchors want it too — the skip link below is one, and a banner or a modal will be more.
// Claiming the whole namespace means every such anchor reads as an unroutable view and silently
// throws the reader back to the default, which is worst for the keyboard user the skip link
// exists for. So a fragment that is not `#/…` is not addressed to the router: it is left alone.
const VIEWS = { chat: "view-chat", settings: "view-settings" };
const DEFAULT_VIEW = "chat";
const ROUTE_PREFIX = "#/";

function routedView() {
  // Returns the view a `#/…` fragment names, or null when the fragment is not a route at all.
  // Null and DEFAULT_VIEW are deliberately different answers: "not addressed to me, change
  // nothing" is not the same as "addressed to me and unrecognised, show the default".
  const hash = window.location.hash || "";
  if (!hash.startsWith(ROUTE_PREFIX)) return null;
  const name = hash.slice(ROUTE_PREFIX.length);
  return Object.prototype.hasOwnProperty.call(VIEWS, name) ? name : DEFAULT_VIEW;
}

function showView(name) {
  // Focus is deliberately not moved. The nav is anchors, so activating one leaves focus on the
  // link the reader just used and Tab continues into the view they opened — the browser's own
  // behaviour, and correct here. Moving focus into the view would be right for a modal, which is
  // what #164 adds; it is wrong for navigation, where it strands the reader outside the nav.
  for (const key of Object.keys(VIEWS)) {
    const active = key === name;
    $(VIEWS[key]).hidden = !active;
    const link = $("nav-" + key);
    link.classList.toggle("active", active);
    // aria-current is the state a screen reader announces; the class is only paint. Removed
    // rather than set to "false" — the attribute's absence is what "not current" means.
    if (active) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  }
}

window.addEventListener("hashchange", () => {
  const view = routedView();
  // Null means some other anchor moved the fragment. Leave the view where the reader put it.
  if (view !== null) showView(view);
});

// ---- data -----------------------------------------------------------------------------------
async function getJSON(url) {
  const r = await fetch(url);
  // `fetch` rejects only on a transport failure, and this server answers a failed read view with a
  // well-formed `{"error": ...}` body at HTTP 500 (and an unknown path at 404). Both parse, so
  // without this check an error response reads as data: the stats card renders zeroes, the roster
  // renders an empty table, and the status footer — whose whole purpose is that an unreadable
  // store must not look like a healthy one — sees an empty findings list and hides.
  if (!r.ok) {
    // `server.py` answers a raising read view with `{"error": str(exc)}` and silences its own
    // per-request logging, so that body is the ONLY place the cause is rendered in the whole
    // system. Throwing on the status alone leaves the operator a bare number — and VRF-008's
    // corrupt-pricing step walks straight into it.
    let detail = " (no JSON body)";
    try {
      const body = await r.json();
      detail = body && body.error ? `: ${body.error}` : "";
    } catch (parseError) {
      // Keep the marker: a non-JSON error body is itself worth knowing about, and the status
      // below still carries the fact of the failure.
    }
    throw new Error(`${url} answered ${r.status}${detail}`);
  }
  return r.json();
}

function money(n) { return "$" + (Number(n) || 0).toFixed(2); }

// The panel's two honesty signals live here rather than in the Settings stats card. Both say
// "the numbers may not mean what you think", and a card-bound caveat says it only to a reader who
// already navigated to the card. The footer is visible from every view, including the Settings
// view itself, so this is a move and not a second copy.
//
// `items` is a list of plain strings; escaping happens here, once, so a caller cannot forget it.
// `null` is a distinct third state, not an absence: see below.
function statusItem(text, extraClass) {
  return `<span class="item${extraClass ? " " + esc(extraClass) : ""}">${esc(text)}</span>`;
}

function renderStatusBar(items) {
  const bar = $("statusbar");
  // Two elements on purpose: `bar` is the full-width strip that carries the background, the rule
  // and the `hidden` state; `items` is the centred column inside it that the text sits in.
  const slot = $("statusbarItems");
  // Unhidden BEFORE the content is written, in every branch. Content injected into a
  // `display: none` subtree is not announced by most assistive tech, and unhiding an
  // already-populated region is not reliably announced either — so the one transition this live
  // region exists for, a finding appearing after a run, is the one that would stay silent.
  if (items === null) {
    // A store that could not be reached must not render identically to a healthy one. An empty
    // bar is the panel saying "asked, nothing to report"; this is the panel saying "could not
    // ask", which is the state in which the figures above are least trustworthy. The wording
    // claims only what this code knows: the read failed, not why, and not that the server is down.
    bar.hidden = false;
    slot.innerHTML = statusItem("the panel could not read /api/stats.", "unknown");
    return;
  }
  // Nothing to say is the common case, and a permanently empty bar would train the reader to
  // stop looking at the one strip that only ever appears when something is wrong.
  if (items.length === 0) {
    slot.innerHTML = "";
    bar.hidden = true;
    return;
  }
  bar.hidden = false;
  slot.innerHTML = items.map((text) => statusItem(text)).join("");
}

// ---- spend breakdowns -------------------------------------------------------------------------
// The windows the chart offers. The store retains far more (400 days) and `/api/stats` sends the
// widest of these; 7/30/90 is what the panel draws.
const CHART_WINDOWS = [7, 30, 90];
// View state, not operator state: the chosen window is not persisted anywhere, so a reload starts
// at 30 — the shortest window that shows a weekly rhythm rather than a single spike.
let chartWindow = 30;
// The last answer from /api/stats, kept so a window button re-renders without refetching. The
// series is ascending, oldest first, and zero-filled inside the range it covers — see the note on
// `chartCaption` for why its FIRST entry, not `since`, is the left edge.
let chartData = { series: [], lifetime: 0, outside: 0, since: "" };

function sparkPoints(values, width, height, pad) {
  // Values map to a polyline. The y-scale runs 0 → max rather than min → max: this is money
  // avoided, where zero is a real quantity, and a chart whose baseline floats turns a flat month
  // into a dramatic one.
  const max = Math.max(...values, 0);
  const span = height - pad * 2;
  const step = values.length > 1 ? width / (values.length - 1) : 0;
  return values.map((v, i) => {
    const x = values.length > 1 ? i * step : width / 2;
    const y = max > 0 ? pad + span - (v / max) * span : pad + span;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
}

function dayTwin(shown) {
  // Every drawn value as text, collapsed by default. Not an accessibility afterthought: this
  // chart ships no tooltip, so without it a number would be readable only as a shape.
  const rows = shown.map((e) => `<tr><td class="mono">${esc(e.day)}</td><td class="num">${money(e.spend_avoided_usd)}</td></tr>`).join("");
  return `<details class="twin"><summary>Show the numbers</summary>
    <table><thead><tr><th>day</th><th class="num">spend avoided</th></tr></thead><tbody>${rows}</tbody></table></details>`;
}

function chartCaption(shown) {
  // Always rendered, and it states the range actually drawn. Three facts, in the order a reader
  // needs them:
  //
  // 1. What is on screen. The series ends at the newest recorded day, not at today, so an idle
  //    install shows a chart that stops when the activity did — and says so rather than implying
  //    the last week was zero.
  // 2. How much of the lifetime total this window leaves out. Plain arithmetic here.
  // 3. Whether any of the lifetime total can never be charted at all. The panel cannot work this
  //    out: `spend_avoided_outside_days_usd` is the server's answer, summed over every retained
  //    day bucket rather than the charted ones.
  //
  // `since` names when per-day recording began and is deliberately NOT the chart's left edge:
  // once the store starts evicting its oldest days, that date is older than anything left, and
  // drawing from it would paint the evicted span as $0 — asserting quiet days that were merely
  // not kept.
  const drawn = shown.reduce((sum, e) => sum + (Number(e.spend_avoided_usd) || 0), 0);
  const outsideWindow = Math.max(chartData.lifetime - drawn, 0);
  const parts = [`Last ${shown.length} day${shown.length === 1 ? "" : "s"} · ${esc(shown[0].day)} → ${esc(shown[shown.length - 1].day)} · ${money(drawn)} avoided`];
  if (outsideWindow >= 0.005) {
    let more = `${money(outsideWindow)} of the ${money(chartData.lifetime)} lifetime total falls outside this window`;
    if (chartData.outside >= 0.005) {
      more += `, including ${money(chartData.outside)} that no per-day bucket holds`;
      more += chartData.since ? ` — per-day recording began ${esc(chartData.since)}` : "";
    }
    parts.push(more + ".");
  }
  return `<div class="chart-caption">${parts.join(" · ")}</div>`;
}

function chartMarkup() {
  // Head and plot are separate so a window change can replace the plot alone: re-rendering the
  // buttons would destroy the one the reader just pressed, and a keyboard user would lose focus
  // to the top of the document on every press.
  const buttons = CHART_WINDOWS.map((n) =>
    `<button class="winbtn" data-window="${n}" aria-pressed="${n === chartWindow}">${n}d</button>`).join("");
  // Real buttons in a labelled group, not a custom widget: aria-pressed is the state, and the
  // keyboard behaviour is the browser's rather than ours to reimplement.
  return `<div class="chart-head"><span class="muted" style="font-size:.75rem">daily, newest on the right</span>
    <span class="win" role="group" aria-label="Chart window">${buttons}</span></div>
    <div id="chartPlot">${chartPlot()}</div>`;
}

function chartPlot() {
  const series = chartData.series || [];
  if (!series.length) {
    // Degrade to less information, never to an error — and never to a flat line at $0, which
    // would assert a quiet month over a store that simply has no per-day history yet.
    return `<div class="chart-caption">No per-day figures recorded yet. They begin with the next task this install records.</div>`;
  }
  const shown = series.slice(-chartWindow);
  const values = shown.map((e) => Number(e.spend_avoided_usd) || 0);
  const W = 300, H = 60, PAD = 3;
  const points = sparkPoints(values, W, H, PAD);
  const peak = Math.max(...values);
  const peakDay = shown[values.indexOf(peak)].day;
  const total = values.reduce((a, b) => a + b, 0);
  // The chart is one graphic, so it carries one label rather than a node per point. It names what
  // a sighted reader takes from the shape — span, total, where the peak is — and the twin below
  // carries every individual value.
  const label = `Spend avoided per day, last ${shown.length} days to ${shown[shown.length - 1].day}. Total ${money(total)}, peak ${money(peak)} on ${peakDay}.`;
  const last = points[points.length - 1].split(",");
  // The newest day, marked. A zero-length round-capped line rather than a circle — see the
  // stylesheet: under a non-uniform stretch a circle is an ellipse, a round cap is still round.
  const dot = `<line x1="${last[0]}" y1="${last[1]}" x2="${last[0]}" y2="${last[1]}"></line>`;
  const line = points.length > 1 ? `<polyline points="${points.join(" ")}"></polyline>` : "";
  const svg = `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}" focusable="false">${line}${dot}</svg>`;
  return svg + chartCaption(shown) + dayTwin(shown);
}

function modelTable(rows) {
  if (!rows.length) return `<div class="muted" style="font-size:.8rem">No per-model figures recorded yet.</div>`;
  const max = Math.max(...rows.map((r) => Number(r.spend_avoided_usd) || 0), 0);
  const body = rows.map((r) => {
    const spend = Number(r.spend_avoided_usd) || 0;
    const pct = max > 0 ? Math.max(Math.round((spend / max) * 100), 1) : 0;
    // The bar is hidden from assistive tech because it encodes the number in the cell beside it —
    // announcing it again would be noise, and it is never the only carrier of the value.
    return `<tr><td class="mono">${esc(r.id)}</td><td class="num">${(Number(r.count) || 0).toLocaleString()}</td>
      <td class="num">${money(spend)}</td>
      <td class="barcell" aria-hidden="true">${pct ? `<span class="bar" style="width:${pct}%"></span>` : ""}</td></tr>`;
  }).join("");
  return `<table><thead><tr><th>model</th><th class="num">requests</th><th class="num">spend avoided</th><th aria-hidden="true"></th></tr></thead><tbody>${body}</tbody></table>`;
}

async function loadStats() {
  try {
    const d = await getJSON("/api/stats");
    // A 200 is not the same as an answer this code understands. Without this, an unrecognised
    // body leaves `health` and `is_placeholder` undefined, the findings list empty, and the bar
    // hidden — the panel's "asked, and all clear" state over a response it could not read. The
    // throw lands in the catch below, which is already the could-not-read path.
    if (!d || typeof d !== "object" || !("summary" in d) || !("health" in d)) {
      throw new Error("/api/stats returned an unrecognised payload");
    }
    const s = d.summary || {};
    const tiers = Object.entries(s.by_tier || {}).map(([k, v]) => `${esc(k)} ${v}`).join(", ") || "—";
    // Origin split (#74): shown only once some record is actually tagged — all-untagged history
    // adds no signal (mirrors the CLI's format_rollup stance).
    const byOrigin = s.by_origin || {};
    const hasOrigin = Object.keys(byOrigin).some((k) => k !== "untagged");
    const origins = Object.entries(byOrigin).map(([k, v]) => `${esc(k)} ${v}`).join(", ");
    let html = `<div class="stat-grid">
      <div class="stat"><div class="label">Tasks routed</div><div class="value">${s.tasks || 0}</div></div>
      <div class="stat"><div class="label">Spend avoided</div><div class="value big">${money(s.spend_avoided_usd)}</div></div>
      <div class="stat"><div class="label">By tier</div><div class="value mono" style="font-size:.95rem">${tiers}</div></div>
      ${hasOrigin ? `<div class="stat"><div class="label">By origin</div><div class="value mono" style="font-size:.95rem">${origins}</div></div>` : ""}
      <div class="stat"><div class="label">Est. tokens (in / out)</div><div class="value mono" style="font-size:.95rem">${(s.in_tokens_est||0).toLocaleString()} / ${(s.out_tokens_est||0).toLocaleString()}</div></div>
    </div>`;
    // The placeholder caveat and the measurement-health findings are routed to the status footer
    // instead of this card — same wording, same refresh points, seen from every view.
    //
    // Measurement health is re-probed on every /api/stats request rather than once per process:
    // this panel is long-lived, so the one-shot stderr notice `record_task` emits is printed at
    // most once for the process's whole life and is effectively invisible here. Note the panel
    // does not poll — this refreshes on load, after a run, and after a pricing save — so an idle
    // panel shows the store as it was at the last of those. Findings are server-composed strings
    // and are escaped like any other server value.
    const status = [];
    if (d.is_placeholder) status.push(`⚠ pricing: PLACEHOLDER — figures illustrative until the anchor is ratified.`);
    for (const finding of d.health || []) status.push(`⚠ measurement: ${finding}.`);
    renderStatusBar(status);
    // The two breakdowns of the headline above. Both are populated from task records only, so
    // they sum to the figure they break down: a delegate's saving is credited to its parent task
    // and a failed task avoided nothing.
    chartData = {
      series: Array.isArray(s.by_day) ? s.by_day : [],
      lifetime: Number(s.spend_avoided_usd) || 0,
      outside: Number(s.spend_avoided_outside_days_usd) || 0,
      since: s.by_day_since || "",
    };
    html += `<h3 class="sub-head">By model <span class="muted">(lifetime)</span></h3>${modelTable(s.by_model || [])}`;
    html += `<h3 class="sub-head">Spend avoided over time</h3><div id="chartRegion">${chartMarkup()}</div>`;
    const dg = s.delegates || {};
    if (dg.count) {
      const backends = (dg.by_backend || []).map((b) => `${esc(b.id)} ${b.count || 0}`).join(", ") || "—";
      // How many top-level tasks the sub-calls link back to. Mirrors the CLI's "Linked to" line.
      // Labelled as window-scoped because it is the one figure here that is: it is derived from a
      // tree holding one key per parent task id, which is unbounded and so is never folded into
      // the permanent totals every other figure includes.
      const linked = dg.linked_parents || 0;
      html += `<h3 class="sub-head">Delegated sub-tasks <span class="muted">(offloaded by orchestrators)</span></h3>
      <div class="stat-grid">
        <div class="stat"><div class="label">Sub-tasks</div><div class="value">${dg.count}</div></div>
        <div class="stat"><div class="label">By backend</div><div class="value mono" style="font-size:.95rem">${backends}</div></div>
        ${linked ? `<div class="stat"><div class="label">Linked to</div><div class="value mono" style="font-size:.95rem">${linked} parent task(s) <span class="muted">(current row window)</span></div></div>` : ""}
        ${dg.linkage_lost ? `<div class="stat"><div class="label">Linkage lost</div><div class="value">${dg.linkage_lost}</div></div>` : ""}
        <div class="stat"><div class="label">Est. tokens (in / out)</div><div class="value mono" style="font-size:.95rem">${(dg.in_tokens_est||0).toLocaleString()} / ${(dg.out_tokens_est||0).toLocaleString()}</div></div>
        <div class="stat"><div class="label">Cloud-equiv</div><div class="value mono" style="font-size:.95rem">${money(dg.cloud_equiv_usd)}</div></div>
      </div>
      <div class="caveat">Informational — delegate spend is already credited within its parent task's “spend avoided”.</div>`;
    }
    $("statsCard").innerHTML = html;
  } catch (e) {
    $("statsCard").innerHTML = `<span class="err">failed to load stats</span>`;
    // The panel's only debugging channel. Without it the operator investigates a healthy server
    // while the actual error — which may be a payload shape this code did not expect, not a
    // transport failure at all — is unrecoverable from the surface.
    console.error("stats:", e);
    // The card's error is on the Settings view only. Without this the Chat view would show a
    // clean footer while the store was unreadable.
    renderStatusBar(null);
  }
}

async function loadRoster() {
  try {
    const [d, settings] = await Promise.all([
      getJSON("/api/roster"),
      getJSON("/api/settings").catch(() => ({})),
    ]);
    const billingOn = !!settings.api_billing_enabled;
    const hasApi = (d.entries || []).some(e => e.tier === "api");
    // Surface the paid-API billing gate so an operator never misreads a paid entry's own
    // enabled flag as "live" — paid routing needs the global gate on too (issue #2).
    const banner = hasApi
      ? (billingOn
          ? `<div class="caveat">Paid-API billing: <b>ON</b> — enabled <code>tier: api</code> entries are routable as the last resort. Real spend possible.</div>`
          : `<div class="muted" style="margin-bottom:10px">Paid-API billing: <b>OFF</b> — every <code>tier: api</code> entry is inert regardless of its own <code>enabled</code> flag.</div>`)
      : "";
    const rows = (d.entries || []).map(e => {
      const inv = e.invoke || {};
      const ref = inv.key_ref ? `<div class="muted mono" style="font-size:.72rem">key: ${esc(inv.key_ref)}</div>` : "";
      const enabled = e.enabled !== false;          // view_roster always sends a bool; default on
      const orch = !!e.can_orchestrate;
      const goodat = (e.good_at || []).join(", ");
      const budget = e.budget_usd_month != null ? e.budget_usd_month : "";
      // Editable scalar fields only (enabled/can_orchestrate/good_at/budget_usd_month). Originals
      // are stashed on the cell so saves send ONLY changed fields — no noisy default-value inserts.
      return `<tr>
        <td class="mono">${esc(e.id)}</td>
        <td><span class="pill ${esc(e.tier)}">${esc(e.tier)}</span><div class="muted" style="font-size:.72rem">${esc(e.cost||"")}</div></td>
        <td class="mono">${esc(inv.kind)}${inv.model ? " · " + esc(inv.model) : ""}${ref}</td>
        <td class="cfg" data-id="${esc(e.id)}" data-enabled="${enabled}" data-orch="${orch}" data-budget="${esc(budget)}" data-goodat="${esc(goodat)}">
          <label class="chk"><input type="checkbox" class="f-enabled" ${enabled ? "checked" : ""}> enabled</label>
          <label class="chk"><input type="checkbox" class="f-orch" ${orch ? "checked" : ""}> orchestrator</label>
          <div class="muted" style="font-size:.74rem;margin-top:4px">good at <input class="f-goodat" value="${esc(goodat)}" style="width:200px"></div>
          <div class="muted" style="font-size:.74rem">budget $/mo <input class="f-budget" value="${esc(budget)}" placeholder="—" style="width:80px"></div>
          <button class="rsave" style="margin-top:4px">Save</button> <span class="rmsg muted" style="font-size:.74rem"></span>
        </td>
      </tr>`;
    }).join("");
    $("rosterCard").innerHTML = banner + `<table><thead><tr><th>id</th><th>tier</th><th>invoke</th><th>config <span class="muted" style="font-weight:400">(editable)</span></th></tr></thead><tbody>${rows}</tbody></table>`;
  } catch (e) {
    console.error("roster:", e);
    $("rosterCard").innerHTML = `<span class="err">failed to load roster</span>`;
  }
}

function renderPricing(p) {
  const ph = p.is_placeholder ? "checked" : "";
  $("pricingCard").innerHTML = `
    <div class="row"><span class="muted" style="min-width:130px">reference model</span>
      <input type="text" id="pRef" value="${esc(p.reference_model)}" style="flex:1; min-width:220px;"></div>
    <div class="row"><span class="muted" style="min-width:130px">input $/MTok</span>
      <input type="text" id="pIn" value="${esc(p.input_per_mtok)}" style="width:120px"></div>
    <div class="row"><span class="muted" style="min-width:130px">output $/MTok</span>
      <input type="text" id="pOut" value="${esc(p.output_per_mtok)}" style="width:120px"></div>
    <div class="row"><label class="chk"><input type="checkbox" id="pPlaceholder" ${ph}> mark as placeholder (figures flagged illustrative)</label></div>
    <div class="row"><button id="pSave">Save pricing</button><span id="pMsg" class="muted"></span></div>`;
  $("pSave").addEventListener("click", savePricing);
}

async function loadPricing() {
  try { renderPricing(await getJSON("/api/pricing")); }
  catch (e) {
    console.error("pricing:", e);
    $("pricingCard").innerHTML = `<span class="err">failed to load pricing</span>`;
  }
}

async function savePricing() {
  if (!confirm("Overwrite config/pricing.yaml with these values? A backup is kept.")) return;
  const msg = $("pMsg");
  $("pSave").disabled = true; msg.textContent = "saving…"; msg.className = "muted";
  const body = {
    reference_model: $("pRef").value,
    input_per_mtok: parseFloat($("pIn").value),
    output_per_mtok: parseFloat($("pOut").value),
    placeholder: $("pPlaceholder").checked,
  };
  try {
    const r = await fetch("/api/pricing", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
    const d = await r.json();
    if (d.ok) {
      renderPricing(d.pricing);
      $("pMsg").textContent = "saved ✓"; $("pMsg").className = "pill local";
      loadStats();  // refresh the placeholder caveat / figures
    } else {
      $("pMsg").textContent = d.error || "save failed"; $("pMsg").className = "err";
    }
  } catch (e) {
    $("pMsg").textContent = "request failed"; $("pMsg").className = "err";
  } finally {
    $("pSave").disabled = false;
  }
}

async function saveRoster(cell, btn) {
  const id = cell.getAttribute("data-id");
  const msg = cell.querySelector(".rmsg");
  // Current control values vs the originals stashed on the cell — send only what changed.
  const enabled = cell.querySelector(".f-enabled").checked;
  const orch = cell.querySelector(".f-orch").checked;
  const goodat = cell.querySelector(".f-goodat").value.split(",").map(s => s.trim()).filter(Boolean);
  const budgetRaw = cell.querySelector(".f-budget").value.trim();
  const fields = {};
  if (enabled !== (cell.getAttribute("data-enabled") === "true")) fields.enabled = enabled;
  if (orch !== (cell.getAttribute("data-orch") === "true")) fields.can_orchestrate = orch;
  if (goodat.join(", ") !== cell.getAttribute("data-goodat")) fields.good_at = goodat;
  if (budgetRaw !== cell.getAttribute("data-budget")) fields.budget_usd_month = (budgetRaw === "" ? null : Number(budgetRaw));
  if (Object.keys(fields).length === 0) { msg.textContent = "no changes"; msg.className = "rmsg muted"; return; }
  if ("budget_usd_month" in fields && fields.budget_usd_month != null && !(fields.budget_usd_month > 0)) {
    msg.textContent = "budget must be a positive number"; msg.className = "rmsg err"; return;
  }
  if (!confirm(`Overwrite config/roster.yaml — update '${id}' (${Object.keys(fields).join(", ")})? A backup is kept; commit the change in git.`)) return;
  btn.disabled = true; msg.textContent = "saving…"; msg.className = "rmsg muted";
  try {
    const r = await fetch("/api/roster", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ id, fields }) });
    const d = await r.json();
    if (d.ok) { loadRoster(); }  // re-render from the persisted file (resets controls + originals)
    else { msg.textContent = d.error || "save failed"; msg.className = "rmsg err"; btn.disabled = false; }
  } catch (e) { msg.textContent = "request failed"; msg.className = "rmsg err"; btn.disabled = false; }
}

async function run() {
  const prompt = $("prompt").value.trim();
  const box = $("runResult");
  if (!prompt) { box.innerHTML = `<div class="err" style="margin-top:10px">enter a prompt first</div>`; return; }
  $("run").disabled = true; $("run").textContent = "Running…";
  box.innerHTML = `<div class="muted" style="margin-top:10px">routing…</div>`;
  try {
    const r = await fetch("/api/run", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ prompt, task: $("task").value.trim() || null, local: $("local").checked })
    });
    const d = await r.json();
    if (d.ok) {
      const s = d.served;
      const served = s ? `<div class="served">served by <b>${esc(s.model)}</b> (${esc(s.tier)} · ${esc(s.path)})</div>` : "";
      box.innerHTML = `<pre class="out">${esc(d.text)}</pre>${served}`;
      loadStats();
    } else {
      box.innerHTML = `<pre class="out err">${esc(d.error)}</pre>`;
    }
  } catch (e) {
    box.innerHTML = `<pre class="out err">request failed: ${esc(e)}</pre>`;
  } finally {
    $("run").disabled = false; $("run").textContent = "Run";
  }
}

$("run").addEventListener("click", run);
// Delegated for the same reason the roster card is: the stats card is re-rendered wholesale on
// every refresh, so a listener bound to a button inside it would not survive one. Re-renders the
// chart region alone — the window is a view choice, not new data, and refetching to change it
// would re-probe the store and re-announce the status bar for nothing.
$("statsCard").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".winbtn");
  if (!btn) return;
  chartWindow = Number(btn.getAttribute("data-window")) || chartWindow;
  for (const b of document.querySelectorAll(".winbtn")) {
    b.setAttribute("aria-pressed", String(Number(b.getAttribute("data-window")) === chartWindow));
  }
  const plot = $("chartPlot");
  if (plot) plot.innerHTML = chartPlot();
});
// Delegated: the roster card is re-rendered on each refresh, so listen on the stable parent.
$("rosterCard").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".rsave");
  if (!btn) return;
  const cell = btn.closest(".cfg");
  if (cell) saveRoster(cell, btn);
});

showView(routedView() || DEFAULT_VIEW);
// Both views' data is fetched at startup regardless of which one is showing. The alternative,
// loading a view's data when it is first opened, saves two localhost fetches and buys a class of
// "this view says loading… forever" bugs; it would also falsify view_stats's docstring, which
// states the panel fetches on load, after a run, and after a pricing save.
loadStats(); loadRoster(); loadPricing();
</script>
</body>
</html>
