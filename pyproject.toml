[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tanglebrain"
version = "0.20.1"
description = "A local-first, config-driven LLM router across OpenAI-compatible backends you own."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jason Vaughan" }]
keywords = ["llm", "router", "ollama", "openai-compatible", "litellm", "local-llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Every dependency carries an upper bound at the next major. An open-ended constraint is what
# made #87 expensive: `mcp >= 1.0` let a major land in every fresh resolve with no announcement
# and no commit to blame. The bound is at the major boundary deliberately — tighter caps buy
# nothing here and create resolution conflicts for anyone installing TangleBrain alongside other
# packages, which is a real cost paid by users to prevent a break that semver already announces.
# Raising a ceiling is a deliberate act with a migration behind it, not a version bump.
dependencies = [
    "httpx >= 0.27, < 1",
    "PyYAML >= 6.0, < 7",
]

# Optional: the MCP local-delegate server (C2b). Keeps the core install lean — only consumers
# that run `tanglebrain-delegate` (so an orchestrator CLI can offload grunt to local) need the
# MCP stack. Install with: pip install "tanglebrain[delegate]".
[project.optional-dependencies]
# Capped below 2.0: the SDK's 2.0.0 (2026-07-28) renamed FastMCP to MCPServer and removed the
# `mcp.server.fastmcp` import path that `tanglebrain/mcp_server.py` uses, so an uncapped resolve
# installs an SDK this code cannot import. Lifting the cap means migrating to the 2.x API.
delegate = ["mcp >= 1.0, < 2"]

[project.urls]
Homepage = "https://github.com/Jason-Vaughan/TangleBrain"
Repository = "https://github.com/Jason-Vaughan/TangleBrain"
Changelog = "https://github.com/Jason-Vaughan/TangleBrain/blob/main/CHANGELOG.md"
Issues = "https://github.com/Jason-Vaughan/TangleBrain/issues"
Releases = "https://github.com/Jason-Vaughan/TangleBrain/releases"

[project.scripts]
tanglebrain = "tanglebrain.cli:main"
tanglebrain-delegate = "tanglebrain.mcp_server:main"
tanglebrain-gui = "tanglebrain.gui.server:main"
tanglebrain-serve = "tanglebrain.serve.server:main"

[tool.setuptools.packages.find]
include = ["tanglebrain*"]

[tool.setuptools.package-data]
tanglebrain = ["config/*.yaml"]
"tanglebrain.gui" = ["static/*.html", "static/*.png"]
