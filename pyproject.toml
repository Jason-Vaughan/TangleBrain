[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tanglebrain"
version = "0.23.0"
description = "A local-first, config-driven LLM router across OpenAI-compatible backends you own."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jason Vaughan" }]
keywords = ["llm", "router", "ollama", "openai-compatible", "litellm", "local-llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Every dependency carries an upper bound at the next major. An open-ended constraint is what
# made #87 expensive: `mcp >= 1.0` let a major land in every fresh resolve with no announcement
# and no commit to blame. The bound is at the major boundary deliberately — tighter caps buy
# nothing here and create resolution conflicts for anyone installing TangleBrain alongside other
# packages, which is a real cost paid by users to prevent a break that semver already announces.
# Raising a ceiling is a deliberate act with a migration behind it, not a version bump.
dependencies = [
    "httpx >= 0.27, < 1",
    "PyYAML >= 6.0, < 7",
]

# Optional: the MCP local-delegate server (C2b). Keeps the core install lean — only consumers
# that run `tanglebrain-delegate` (so an orchestrator CLI can offload grunt to local) need the
# MCP stack. Install with: pip install "tanglebrain[delegate]".
[project.optional-dependencies]
# Migrated to the 2.x API. The floor is 2 because `mcp.server.mcpserver` does not exist in 1.x,
# so this code cannot run against the older major — a floor bump is a breaking change for installs
# even though no TangleBrain API moved (see docs/design/deprecation-policy.md). The ceiling is
# `< 3` for the same reason every other dependency has one: an unbounded floor is how a major
# lands unannounced. Users who need mcp 1.x install TangleBrain 0.20.1, the last release for it.
delegate = ["mcp >= 2, < 3"]

# The lint and type-check toolchain (#113). Dev-only: nothing here is imported at runtime, so the
# minimal-dependency stance — which is about what a *user* installs — is untouched. Bounded at the
# breaking-change unit of each tool rather than at the next major by reflex: ruff is pre-1.0 and
# breaks at a minor, and mypy adds *checks* at a minor, which reds an untouched PR just as hard as
# an API break. The canary argument that justifies a wide range for a runtime dependency does not
# transfer here — no user resolves a dev tool, so an unannounced upgrade is pure noise. Bump these
# deliberately; a tool release that reds the gate is fixed, not un-gated.
dev = ["ruff >= 0.16, < 0.17", "mypy >= 2.3.1, < 2.4", "types-PyYAML >= 6, < 7"]

[project.urls]
Homepage = "https://github.com/Jason-Vaughan/TangleBrain"
Repository = "https://github.com/Jason-Vaughan/TangleBrain"
Changelog = "https://github.com/Jason-Vaughan/TangleBrain/blob/main/CHANGELOG.md"
Issues = "https://github.com/Jason-Vaughan/TangleBrain/issues"
Releases = "https://github.com/Jason-Vaughan/TangleBrain/releases"

[project.scripts]
tanglebrain = "tanglebrain.cli:main"
tanglebrain-delegate = "tanglebrain.mcp_server:main"
tanglebrain-gui = "tanglebrain.gui.server:main"
tanglebrain-serve = "tanglebrain.serve.server:main"

[tool.setuptools.packages.find]
include = ["tanglebrain*"]

[tool.setuptools.package-data]
tanglebrain = ["config/*.yaml"]
"tanglebrain.gui" = ["static/*.html", "static/*.png"]

# --- Code quality gates -------------------------------------------------------------------------
# The ruling behind this configuration is recorded in docs/design/nonfunctional-requirements.md,
# "Code quality gates". In short: lint and type-check for *defects*, do not enforce *style*.
# A formatter was measured and declined — it would have rewritten 41 of 45 files while catching
# nothing — so no rule here exists to make code look a particular way.

[tool.ruff]
target-version = "py310"
# Recorded so the rules that reference a width use the width this codebase is actually written to.
# It is NOT gated: E501 is deliberately unselected, because wrapping is a style opinion and the
# long lines here are prose in docstrings that reads worse when broken.
line-length = 100

[tool.ruff.lint]
# Every rule here answers "would a human reviewer call this a bug?" — unused names, late-binding
# closures, unchained re-raises, swallowed exceptions. Style families (import order, quote shape,
# modernization rewrites) are deliberately absent; they are the formatter question under another
# name, and the formatter was declined.
select = [
    "F",      # pyflakes — unused imports and names, undefined references
    "E4",     # import placement
    "E7",     # statement-level defects (comparison to None/True, bare except, type comparison)
    "E9",     # syntax and IO errors
    "B",      # bugbear — late-binding closures, mutable defaults, unchained re-raises
    "BLE",    # blind except — see below
    "N",      # naming, so an exported name cannot quietly stop matching its kind
    "S110",   # try/except/pass: a swallowed exception with no rationale
    "RUF100", # unused noqa
]
ignore = [
    # Multiple statements on one line. Pure layout, and the test suite uses `a = 1; b = 2` setup
    # lines deliberately to keep a long arrange block scannable.
    "E701",
    "E702",
]

# BLE and RUF100 are the pair that matters most here, and they were chosen together. This codebase
# already carried `# noqa: BLE001` and `# noqa: N802` comments written as though a linter were
# running — every one of them was inert, because no linter had ever selected those rules. BLE makes
# each broad catch a deliberate, justified waiver instead of a silent one; RUF100 makes the waivers
# themselves honest, by failing when a suppression stops suppressing anything.

[tool.ruff.lint.per-file-ignores]
# `RouterCls` and friends name a patched *class*, so the capital is correct and the rule is wrong.
"tests/*" = ["N806"]

[tool.mypy]
python_version = "3.10"
# Production only. The annotations here are load-bearing documentation of a public surface; the
# test suite's are convenience, and checking it would add noise without adding a guarantee.
files = ["tanglebrain"]
# Default strictness, deliberately. `--strict` was measured at 62 errors, 39 of them `type-arg`
# ceremony over bare `dict`/`list`; default mode found 11, and every one was a real Optional-handling
# gap. The reasoning, and what would justify revisiting, is in the design doc named above.

# Scoped rather than global on purpose: a repo-wide `ignore_missing_imports` also silences a
# *first-party* import that was renamed or misspelled — it resolves to `Any` instead of erroring,
# which is the class of defect this gate exists to catch, and ruff's `F` rules cannot see it
# because the name is bound. httpx ships types and types-PyYAML is in the dev extra, so `mcp` is
# the only genuinely stubless import.
[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
